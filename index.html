<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub 账号信息查询</title>
  <!-- 网站图标 (Favicon)：GitHub 官方 SVG -->
  <link rel="icon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 图标库 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 字体优化：Inter 与 Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
          },
          colors: {
            paper: '#FBFBFA',
            subtle: '#F4F4F1',
            ink: {
              DEFAULT: '#191919',
              muted: '#737373',
              border: '#E8E8E5',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8F7F4;
      color: #191919;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 font-sans antialiased selection:bg-neutral-200">

  <!-- 顶部导航与 Token 配置 -->
  <header class="w-full max-w-3xl flex items-center justify-between mb-8">
    <div class="flex items-center space-x-2.5">
      <!-- 黑底圆角块内置入 GitHub 官方白色矢量 Logo，避免依赖 Lucide 渲染 -->
      <div class="w-8 h-8 rounded-lg bg-neutral-900 text-white flex items-center justify-center shadow-sm">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.01 8.01 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27s-1.36.09-2 .27c-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
        </svg>
      </div>
      <span class="font-semibold tracking-tight text-neutral-900 text-base">GitHub 账号信息查询</span>
    </div>

    <!-- Token 配置按钮（防 GitHub API 403 限流） -->
    <div>
      <button id="tokenBtn" class="flex items-center space-x-1.5 text-xs text-neutral-500 hover:text-neutral-900 px-2.5 py-1.5 rounded-lg border border-neutral-200/80 bg-white/70 hover:bg-white transition-all shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
        <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
        <span>API Token</span>
      </button>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="w-full max-w-3xl flex-1 flex flex-col items-center justify-center">
    <!-- 搜索栏区 -->
    <section class="w-full mb-8">
      <form id="searchForm" class="relative flex items-center">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-neutral-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input 
          id="usernameInput"
          type="text" 
          placeholder="输入 GitHub 用户名" 
          autocomplete="off"
          spellcheck="false"
          class="w-full pl-12 pr-28 py-3.5 bg-white border border-neutral-200/90 rounded-2xl text-neutral-900 text-sm shadow-[0_2px_8px_rgba(0,0,0,0.02)] focus:outline-none focus:border-neutral-400 focus:ring-4 focus:ring-neutral-100 transition-all placeholder:text-neutral-400"
        />
        <button 
          type="submit"
          class="absolute right-2 px-4 py-2 bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-medium rounded-xl transition-all shadow-sm active:scale-95"
        >
          查看资料
        </button>
      </form>
    </section>

    <!-- 加载中动画 -->
    <div id="loading" class="hidden w-full flex flex-col items-center justify-center py-16 space-y-3">
      <div class="w-6 h-6 border-2 border-neutral-200 border-t-neutral-800 rounded-full animate-spin"></div>
      <p class="text-xs text-neutral-400 tracking-wide">正在解析 GitHub 数据...</p>
    </div>

    <!-- 错误反馈 -->
    <div id="errorBox" class="hidden w-full p-4 mb-6 bg-red-50/60 border border-red-200/60 rounded-xl text-red-700 text-xs flex items-center space-x-2">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
      <span id="errorMessage">无法找到该用户，请检查用户名是否拼写正确。</span>
    </div>

    <!-- 用户信息卡片主容器 -->
    <article id="profileCard" class="hidden w-full bg-white border border-neutral-200/80 rounded-3xl p-6 sm:p-8 shadow-[0_4px_24px_rgba(0,0,0,0.03)] space-y-7 transition-all">
      
      <!-- 头部：头像 + 基本信息 -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5 pb-6 border-b border-neutral-100">
        <img id="avatar" src="" alt="Avatar" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover ring-1 ring-neutral-200/70 shadow-sm bg-neutral-100 flex-shrink-0" />
        
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h1 id="fullName" class="text-xl sm:text-2xl font-bold tracking-tight text-neutral-900 truncate"></h1>
            <span id="hireableBadge" class="hidden text-[10px] font-medium tracking-wide uppercase px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200/70 rounded-md">Open to work</span>
          </div>

          <div class="flex flex-wrap items-center gap-2 mt-1">
            <a id="profileLink" href="#" target="_blank" rel="noopener noreferrer" class="text-sm font-medium text-neutral-500 hover:text-neutral-900 flex items-center gap-1 group">
              <span id="username">@username</span>
              <i data-lucide="external-link" class="w-3 h-3 text-neutral-400 group-hover:text-neutral-900 transition-colors"></i>
            </a>
            <span class="text-neutral-300">•</span>
            <!-- 加入时间（精确到秒）与加入时长分开展示 -->
            <span class="text-xs text-neutral-500 flex items-center gap-1 bg-neutral-50 px-2 py-0.5 rounded-md border border-neutral-200/60">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-neutral-400"></i>
              <span id="joinedDateText">加入于 2017-01-15 00:00:00</span>
            </span>
            <span id="joinedDurationText" class="text-xs text-neutral-500 bg-neutral-50 px-2 py-0.5 rounded-md border border-neutral-200/60">已加入 8 年 · 共 2,926 天</span>
          </div>

          <p id="bio" class="text-sm text-neutral-600 mt-3 leading-relaxed break-words"></p>
        </div>
      </div>

      <!-- 核心统计数据 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span class="text-xs text-neutral-400 font-medium mb-1">公开仓库</span>
          <span id="statRepos" class="text-lg font-bold text-neutral-900">0</span>
        </div>
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span class="text-xs text-neutral-400 font-medium mb-1">关注者</span>
          <span id="statFollowers" class="text-lg font-bold text-neutral-900">0</span>
        </div>
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span class="text-xs text-neutral-400 font-medium mb-1">正在关注</span>
          <span id="statFollowing" class="text-lg font-bold text-neutral-900">0</span>
        </div>
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span class="text-xs text-neutral-400 font-medium mb-1">代码片段 (Gists)</span>
          <span id="statGists" class="text-lg font-bold text-neutral-900">0</span>
        </div>
      </div>

      <!-- 附加元信息（公司、地点、博客、社交账号） -->
      <div id="metaGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1 text-xs text-neutral-600">
        <div id="metaCompany" class="flex items-center gap-2 truncate">
          <i data-lucide="building-2" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <span class="truncate" id="metaCompanyText"></span>
        </div>
        <div id="metaLocation" class="flex items-center gap-2 truncate">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <span class="truncate" id="metaLocationText"></span>
        </div>
        <div id="metaBlog" class="flex items-center gap-2 truncate">
          <i data-lucide="link" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <a id="metaBlogLink" href="#" target="_blank" rel="noopener noreferrer" class="truncate hover:text-neutral-900 underline underline-offset-2"></a>
        </div>
        <div id="metaTwitter" class="flex items-center gap-2 truncate">
          <i data-lucide="twitter" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <a id="metaTwitterLink" href="#" target="_blank" rel="noopener noreferrer" class="truncate hover:text-neutral-900"></a>
        </div>
      </div>

      <!-- 最近活跃公开仓库 -->
      <div class="pt-5 border-t border-neutral-100">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-3.5">最新活跃仓库</h3>
        <div id="repoList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- 动态注入仓库 -->
        </div>
      </div>
    </article>
  </main>

  <!-- 底部页脚 -->
  <footer class="w-full max-w-3xl text-center py-6 text-xs text-neutral-400">
    <p>使用 GitHub 公开数据</p>
  </footer>

  <script>
    // 初始化 Lucide 图标
    function refreshIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // 加入日期：精确到时分秒
    function formatJoinedDateTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      const p = (n) => String(n).padStart(2, '0');
      return `加入于 ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    // 加入时长：换算年限 + 总天数
    function formatJoinedDuration(isoString) {
      if (!isoString) return '';
      const createdDate = new Date(isoString);
      const now = new Date();
      const totalDays = Math.floor((now.getTime() - createdDate.getTime()) / 86400000);

      // 计算完整年份与月份差异
      let diffYears = now.getFullYear() - createdDate.getFullYear();
      let diffMonths = now.getMonth() - createdDate.getMonth();
      if (now.getDate() < createdDate.getDate()) {
        diffMonths--;
      }
      if (diffMonths < 0) {
        diffYears--;
        diffMonths += 12;
      }

      let durationText = '';
      if (diffYears < 1) {
        durationText = diffMonths > 0 ? `已加入 ${diffMonths} 个月` : '新加入';
      } else {
        durationText = diffMonths >= 6 ? `已加入 ${diffYears} 年半` : `已加入 ${diffYears} 年`;
      }

      return `${durationText} · 共 ${totalDays.toLocaleString()} 天`;
    }

    // 组装请求头（优先读取 localStorage 中的 token）
    function getHeaders() {
      const headers = { 'Accept': 'application/vnd.github.v3+json' };
      const token = localStorage.getItem('gh_token');
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      return headers;
    }

    // 获取并展示用户数据
    async function fetchUserData(username) {
      if (!username) return;

      const loading = document.getElementById('loading');
      const errorBox = document.getElementById('errorBox');
      const profileCard = document.getElementById('profileCard');
      const errorMessage = document.getElementById('errorMessage');

      loading.classList.remove('hidden');
      errorBox.classList.add('hidden');
      profileCard.classList.add('hidden');

      try {
        const headers = getHeaders();
        const userRes = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`, { headers });

        if (userRes.status === 404) {
          throw new Error(`未找到用户 "${username}"，请核对用户名。`);
        }
        if (userRes.status === 403) {
          throw new Error('已达到 GitHub 匿名 API 访问频次上限（60次/小时），请点击右上角配置 API Token。');
        }
        if (!userRes.ok) {
          throw new Error(`获取数据异常（状态码：${userRes.status}）`);
        }

        const user = await userRes.json();

        // 获取该用户前 4 个最新更新的仓库
        const repoRes = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?sort=updated&per_page=4`, { headers });
        const repos = repoRes.ok ? await repoRes.json() : [];

        renderProfile(user, repos);
        window.location.hash = username;
      } catch (err) {
        errorMessage.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        refreshIcons();
      }
    }

    // 渲染用户卡片
    function renderProfile(user, repos) {
      document.getElementById('avatar').src = user.avatar_url;
      document.getElementById('fullName').textContent = user.name || user.login;
      document.getElementById('username').textContent = `@${user.login}`;
      document.getElementById('profileLink').href = user.html_url;

      // 雇佣状态
      const hireableBadge = document.getElementById('hireableBadge');
      if (user.hireable) {
        hireableBadge.classList.remove('hidden');
      } else {
        hireableBadge.classList.add('hidden');
      }

      // 加入时间（精确到秒）与加入时长分开展示
      document.getElementById('joinedDateText').textContent = formatJoinedDateTime(user.created_at);
      document.getElementById('joinedDurationText').textContent = formatJoinedDuration(user.created_at);

      // 个人介绍
      const bioEl = document.getElementById('bio');
      if (user.bio) {
        bioEl.textContent = user.bio;
        bioEl.classList.remove('hidden');
      } else {
        bioEl.classList.add('hidden');
      }

      // 统计数字
      document.getElementById('statRepos').textContent = Number(user.public_repos || 0).toLocaleString();
      document.getElementById('statFollowers').textContent = Number(user.followers || 0).toLocaleString();
      document.getElementById('statFollowing').textContent = Number(user.following || 0).toLocaleString();
      document.getElementById('statGists').textContent = Number(user.public_gists || 0).toLocaleString();

      // 附加属性设置
      renderMetaItem('metaCompany', 'metaCompanyText', user.company);
      renderMetaItem('metaLocation', 'metaLocationText', user.location);

      const blogEl = document.getElementById('metaBlog');
      if (user.blog) {
        const blogUrl = user.blog.startsWith('http') ? user.blog : `https://${user.blog}`;
        const blogLink = document.getElementById('metaBlogLink');
        blogLink.href = blogUrl;
        blogLink.textContent = user.blog.replace(/^https?:\/\//, '');
        blogEl.classList.remove('hidden');
      } else {
        blogEl.classList.add('hidden');
      }

      const twitterEl = document.getElementById('metaTwitter');
      if (user.twitter_username) {
        const twitterLink = document.getElementById('metaTwitterLink');
        twitterLink.href = `https://twitter.com/${user.twitter_username}`;
        twitterLink.textContent = `@${user.twitter_username}`;
        twitterEl.classList.remove('hidden');
      } else {
        twitterEl.classList.add('hidden');
      }

      // 仓库列表渲染
      const repoContainer = document.getElementById('repoList');
      repoContainer.innerHTML = '';

      if (repos && repos.length > 0) {
        repos.forEach(repo => {
          const card = document.createElement('a');
          card.href = repo.html_url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.className = 'p-3.5 rounded-xl border border-neutral-100 bg-neutral-50/50 hover:bg-neutral-50 hover:border-neutral-200 transition-all flex flex-col justify-between group';

          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-semibold text-neutral-900 group-hover:underline truncate">${repo.name}</span>
                <span class="text-[10px] text-neutral-400 font-mono flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3 h-3 text-amber-500 fill-amber-500"></i> ${repo.stargazers_count}
                </span>
              </div>
              <p class="text-[11px] text-neutral-500 line-clamp-2 leading-relaxed mb-2">${repo.description || '暂无描述'}</p>
            </div>
            <div class="flex items-center justify-between text-[10px] text-neutral-400 pt-1">
              <span>${repo.language || 'Plain'}</span>
              <span>更新于 ${new Date(repo.updated_at).toLocaleDateString()}</span>
            </div>
          `;
          repoContainer.appendChild(card);
        });
      } else {
        repoContainer.innerHTML = '<p class="text-xs text-neutral-400 col-span-2 py-3 text-center">暂无可展示的公开仓库</p>';
      }

      document.getElementById('profileCard').classList.remove('hidden');
    }

    function renderMetaItem(containerId, textId, value) {
      const container = document.getElementById(containerId);
      if (value) {
        document.getElementById(textId).textContent = value;
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    // 表单提交事件
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('usernameInput').value.trim();
      if (val) fetchUserData(val);
    });

    // Token 设置提示框
    document.getElementById('tokenBtn').addEventListener('click', () => {
      const currentToken = localStorage.getItem('gh_token') || '';
      const input = prompt('可填入 GitHub Personal Access Token 提升至 5000次/小时 额度（仅保存在您的本地浏览器中，留空则清除）：', currentToken);
      if (input !== null) {
        if (input.trim() === '') {
          localStorage.removeItem('gh_token');
          alert('已恢复为默认匿名访问');
        } else {
          localStorage.setItem('gh_token', input.trim());
          alert('Token 已妥善保存在本地！');
        }
      }
    });

    // 初始化入口：读取 URL Hash 则自动查询，无 Hash 时只展示输入框
    window.addEventListener('DOMContentLoaded', () => {
      refreshIcons();
      const hashUser = window.location.hash.replace('#', '').trim();
      if (hashUser) {
        document.getElementById('usernameInput').value = hashUser;
        fetchUserData(hashUser);
      }
    });
  </script>
</body>
</html>
