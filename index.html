<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub 账号信息查询</title>
  <!-- 网站图标 (Favicon)：GitHub 官方 SVG -->
  <link rel="icon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 图标库 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 字体优化：Inter 与 Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
          },
          colors: {
            paper: '#FBFBFA',
            subtle: '#F4F4F1',
            ink: {
              DEFAULT: '#191919',
              muted: '#737373',
              border: '#E8E8E5',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 font-sans antialiased selection:bg-neutral-200">

  <!-- 顶部导航与 Token 配置 -->
  <header class="w-full max-w-3xl flex items-center justify-between mb-8">
    <div class="flex items-center space-x-2.5">
      <!-- 黑底圆角块内置入 GitHub 官方白色矢量 Logo，避免依赖 Lucide 渲染 -->
      <div class="w-8 h-8 rounded-lg bg-neutral-900 text-white flex items-center justify-center shadow-sm">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.01 8.01 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27s-1.36.09-2 .27c-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
        </svg>
      </div>
      <span data-i18n="appTitle" class="font-semibold tracking-tight text-neutral-900 text-base">GitHub 账号信息查询</span>
    </div>

    <!-- 剩余额度 + 语言切换 + Token 配置按钮（防 GitHub API 403 限流） -->
    <div class="flex items-center gap-2">
      <span id="rateLimitText" class="text-xs text-neutral-400"></span>
      <button id="langBtn" class="text-xs text-neutral-500 hover:text-neutral-900 px-2.5 py-1.5 rounded-lg border border-neutral-200/80 bg-white/70 hover:bg-white transition-all shadow-[0_1px_2px_rgba(0,0,0,0.03)]">EN</button>
      <button id="tokenBtn" class="flex items-center space-x-1.5 text-xs text-neutral-500 hover:text-neutral-900 px-2.5 py-1.5 rounded-lg border border-neutral-200/80 bg-white/70 hover:bg-white transition-all shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
        <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
        <span data-i18n="apiToken">API Token</span>
      </button>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="w-full max-w-3xl flex-1 flex flex-col items-center justify-center">
    <!-- 搜索栏区 -->
    <section class="w-full mb-8">
      <form id="searchForm" class="relative flex items-center">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-neutral-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input 
          id="usernameInput"
          type="text" 
          data-i18n-placeholder="searchPlaceholder"
          placeholder="输入 GitHub 用户名" 
          autocomplete="off"
          spellcheck="false"
          class="w-full pl-12 pr-28 py-3.5 bg-white border border-neutral-200/90 rounded-2xl text-neutral-900 text-sm shadow-[0_2px_8px_rgba(0,0,0,0.02)] focus:outline-none focus:border-neutral-400 focus:ring-4 focus:ring-neutral-100 transition-all placeholder:text-neutral-400"
        />
        <button 
          type="submit"
          class="absolute right-2 px-4 py-2 bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-medium rounded-xl transition-all shadow-sm active:scale-95"
        >
          <span data-i18n="searchBtn">查看资料</span>
        </button>
      </form>

      <!-- 最近查询（存本地，不消耗 API 额度） -->
      <div id="historyBar" class="hidden mt-3">
        <div class="flex flex-wrap items-center gap-2 text-xs text-neutral-400">
          <span data-i18n="recent"></span>
          <span id="historyChips" class="flex flex-wrap items-center gap-2"></span>
        </div>
      </div>
    </section>

    <!-- 加载中动画 -->
    <div id="loading" class="hidden w-full flex flex-col items-center justify-center py-16 space-y-3">
      <div class="w-6 h-6 border-2 border-neutral-200 border-t-neutral-800 rounded-full animate-spin"></div>
      <p data-i18n="loading" class="text-xs text-neutral-400 tracking-wide">正在解析 GitHub 数据...</p>
    </div>

    <!-- 错误反馈 -->
    <div id="errorBox" class="hidden w-full p-4 mb-6 bg-red-50/60 border border-red-200/60 rounded-xl text-red-700 text-xs flex items-center space-x-2">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
      <span id="errorMessage">无法找到该用户，请检查用户名是否拼写正确。</span>
    </div>

    <!-- 用户信息卡片主容器 -->
    <article id="profileCard" class="hidden w-full bg-white border border-neutral-200/80 rounded-3xl p-6 sm:p-8 shadow-[0_4px_24px_rgba(0,0,0,0.03)] space-y-7 transition-all">
      
      <!-- 头部：头像 + 基本信息 -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5 pb-6 border-b border-neutral-100">
        <img id="avatar" src="" alt="Avatar" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover ring-1 ring-neutral-200/70 shadow-sm bg-neutral-100 flex-shrink-0" />
        
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h1 id="fullName" class="text-xl sm:text-2xl font-bold tracking-tight text-neutral-900 truncate"></h1>
            <span id="hireableBadge" class="hidden text-[10px] font-medium tracking-wide uppercase px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200/70 rounded-md">Open to work</span>
          </div>

          <div class="flex flex-wrap items-center gap-2 mt-1">
            <a id="profileLink" href="#" target="_blank" rel="noopener noreferrer" class="text-sm font-medium text-neutral-500 hover:text-neutral-900 flex items-center gap-1 group">
              <span id="username">@username</span>
              <i data-lucide="external-link" class="w-3 h-3 text-neutral-400 group-hover:text-neutral-900 transition-colors"></i>
            </a>
            <span class="text-neutral-300">•</span>
            <!-- 加入时间（精确到秒）与加入时长分开展示 -->
            <span class="text-xs text-neutral-500 flex items-center gap-1 bg-neutral-50 px-2 py-0.5 rounded-md border border-neutral-200/60">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-neutral-400"></i>
              <span id="joinedDateText">加入于 2017-01-15 00:00:00</span>
            </span>
            <span id="joinedDurationText" class="text-xs text-neutral-500 bg-neutral-50 px-2 py-0.5 rounded-md border border-neutral-200/60">已加入 8 年 · 共 2,926 天</span>
          </div>

          <p id="bio" class="text-sm text-neutral-600 mt-3 leading-relaxed break-words"></p>
        </div>
      </div>

      <!-- 核心统计数据 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span data-i18n="statRepos" class="text-xs text-neutral-400 font-medium mb-1">公开仓库</span>
          <span id="statRepos" class="text-lg font-bold text-neutral-900">0</span>
        </div>
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span data-i18n="statFollowers" class="text-xs text-neutral-400 font-medium mb-1">关注者</span>
          <span id="statFollowers" class="text-lg font-bold text-neutral-900">0</span>
        </div>
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span data-i18n="statFollowing" class="text-xs text-neutral-400 font-medium mb-1">正在关注</span>
          <span id="statFollowing" class="text-lg font-bold text-neutral-900">0</span>
        </div>
        <div class="p-3.5 rounded-xl bg-neutral-50/70 border border-neutral-100 flex flex-col items-center text-center">
          <span data-i18n="statGists" class="text-xs text-neutral-400 font-medium mb-1">代码片段 (Gists)</span>
          <span id="statGists" class="text-lg font-bold text-neutral-900">0</span>
        </div>
      </div>

      <!-- 附加元信息（公司、地点、博客、社交账号） -->
      <div id="metaGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1 text-xs text-neutral-600">
        <div id="metaCompany" class="flex items-center gap-2 truncate">
          <i data-lucide="building-2" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <span class="truncate" id="metaCompanyText"></span>
        </div>
        <div id="metaLocation" class="flex items-center gap-2 truncate">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <span class="truncate" id="metaLocationText"></span>
        </div>
        <div id="metaBlog" class="flex items-center gap-2 truncate">
          <i data-lucide="link" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <a id="metaBlogLink" href="#" target="_blank" rel="noopener noreferrer" class="truncate hover:text-neutral-900 underline underline-offset-2"></a>
        </div>
        <div id="metaTwitter" class="flex items-center gap-2 truncate">
          <i data-lucide="twitter" class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0"></i>
          <a id="metaTwitterLink" href="#" target="_blank" rel="noopener noreferrer" class="truncate hover:text-neutral-900"></a>
        </div>
      </div>

      <!-- 最近活跃公开仓库 -->
      <div class="pt-5 border-t border-neutral-100">
        <h3 data-i18n="recentRepos" class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-3.5">最新活跃仓库</h3>
        <div id="repoList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- 动态注入仓库 -->
        </div>
      </div>
    </article>
  </main>

  <!-- 底部页脚 -->
  <footer class="w-full max-w-3xl text-center py-6 text-xs text-neutral-400">
    <p data-i18n="footer">使用 GitHub 公开数据</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
